services:
  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    configs:
      - source: prometheus_config_v1
        target: /etc/prometheus/prometheus.yml
      - source: prometheus_alerts_v1
        target: /etc/prometheus/alerts.yml
    volumes:
      - prometheus-data:/prometheus
    networks:
      - monitoring
    deploy:
      placement:
        constraints:
          - node.hostname == thiraphat

  grafana:
    image: grafana/grafana-oss:11.2.2
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_METRICS_ENABLED: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-https://grafana.thiraphat.work}
      GF_SERVER_DOMAIN: grafana.thiraphat.work
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: lax
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: authentik
      GF_AUTH_GENERIC_OAUTH_ICON: signin
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: ${GRAFANA_OAUTH_CLIENT_ID:-grafana}
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${GRAFANA_OAUTH_CLIENT_SECRET}
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid profile email
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: https://sso.thiraphat.work/application/o/authorize/
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: http://10.33.1.34:9000/application/o/token/
      GF_AUTH_GENERIC_OAUTH_API_URL: http://10.33.1.34:9000/application/o/userinfo/
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
      GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: preferred_username
      GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH: name
      GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH: email
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: contains(groups[*], 'Grafana Admins') && 'Admin' || contains(groups[*], 'Grafana Editors') && 'Editor' || 'Viewer'
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_AUTH_OAUTH_AUTO_LOGIN: "false"
      GF_AUTH_SIGNOUT_REDIRECT_URL: https://sso.thiraphat.work/application/o/grafana/end-session/?post_logout_redirect_uri=https%3A%2F%2Fgrafana.thiraphat.work%2Flogin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/homelab-overview.json
      GF_PANELS_DISABLE_SANITIZE_HTML: "true"
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - monitoring
    deploy:
      placement:
        constraints:
          - node.hostname == thiraphat

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    command:
      - --docker_only=true
      - --disable_metrics=disk,diskIO,percpu,sched,process
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - monitoring
    deploy:
      placement:
        constraints:
          - node.hostname == thiraphat3

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    configs:
      - source: blackbox_config_v1
        target: /etc/blackbox_exporter/config.yml
    networks:
      - monitoring
    deploy:
      placement:
        constraints:
          - node.hostname == thiraphat

  docker-exporter:
    image: python:3.12-alpine
    command: ["python", "/app/docker_exporter.py"]
    configs:
      - source: docker_exporter_py_v1
        target: /app/docker_exporter.py
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys/fs/cgroup:/host/sys/fs/cgroup:ro
    networks:
      - monitoring
    deploy:
      mode: global

  host-db-exporter:
    image: python:3.12-alpine
    command: ["python", "/app/host_db_exporter.py"]
    environment:
      NODE_NAME: "{{.Node.Hostname}}"
    configs:
      - source: host_db_exporter_py_v1
        target: /app/host_db_exporter.py
    volumes:
      - /proc:/host/proc:ro
    networks:
      - monitoring
    deploy:
      mode: global

  node-exporter:
    image: prom/node-exporter:v1.8.2
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/host/var/lib/node_exporter/textfile_collector
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks:
      - monitoring
    deploy:
      mode: global

configs:
  prometheus_config_v1:
    file: ./prometheus/prometheus.yml
  prometheus_alerts_v1:
    file: ./prometheus/alerts.yml
  blackbox_config_v1:
    file: ./blackbox/blackbox.yml
  docker_exporter_py_v1:
    file: ./docker-exporter/docker_exporter.py
  host_db_exporter_py_v1:
    file: ./host-db-exporter/host_db_exporter.py

volumes:
  prometheus-data:
  grafana-data:

networks:
  monitoring:
    driver: overlay
    attachable: true
