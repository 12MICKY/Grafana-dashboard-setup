name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: node-34-grafana
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build info
        id: info
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Validate
        run: scripts/validate.sh

      - name: Sync repository files
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.env' \
            --exclude='grafana/dashboards.backup-*/' \
            ./ /home/thiraphat/Grafana-dashboard-setup/

      - name: Deploy monitoring stack
        run: |
          cd /home/thiraphat/Grafana-dashboard-setup
          scripts/deploy-k3s.sh

      - name: Verify
        env:
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          GRAFANA_ADMIN_USER: ${{ secrets.GRAFANA_ADMIN_USER }}
        run: |
          kubectl -n monitoring get pods -o wide
          GRAFANA_USER="${GRAFANA_ADMIN_USER}" \
          GRAFANA_PASSWORD="${GRAFANA_ADMIN_PASSWORD}" \
          /home/thiraphat/Grafana-dashboard-setup/scripts/smoke-test.sh

      - name: Notify
        if: always()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          STATUS="${{ job.status }}"
          ICON=$([ "$STATUS" = "success" ] && echo "✅" || echo "❌")
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d parse_mode="Markdown" \
            -d text="${ICON} *Grafana stack* - ${STATUS} - ${{ steps.info.outputs.sha }} - by ${{ github.actor }}"
